name: CI

# Runs on every pull request, and on master after a merge
on:
  pull_request:
  push:
    branches: [master]

# A newer push to the same branch cancels the run it makes obsolete
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend/MasidBaha.slnx

      - name: Build
        run: dotnet build backend/MasidBaha.slnx -c Release --no-restore

      # The integration tests start PostGIS and an S3 mock with Testcontainers, which the runner's Docker provides
      - name: Test
        run: dotnet test backend/MasidBaha.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: "**/TestResults/*.trx"

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      HUSKY: "0" # no git hooks on the runner
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --ignore-scripts

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: |
          npx ng test shared --watch=false
          npx ng test web --watch=false
          npx ng test admin --watch=false

      - name: Cloudflare Functions tests
        run: npm run test:functions

      - name: Build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend
            args: ""
          - name: web
            context: frontend
            args: PROJECT=web
          - name: admin
            context: frontend
            args: PROJECT=admin
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # Build only (nothing is pushed): catches a broken Dockerfile before it reaches a deploy
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.args }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
