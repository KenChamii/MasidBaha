<div class="map-page" role="main">
  <app-offline-banner
    [isOffline]="isOffline"
    [isShowingCachedData]="isShowingCachedData"
    [cachedDataSavedAt]="cachedDataSavedAt"
  />

  <div #mapContainer class="map-page__map"></div>

  <div class="map-page__toolbar">
    <app-theme-toggle />
    <app-push-toggle />
    <button type="button" class="map-page__list-toggle" (click)="toggleList()">
      {{ showList ? 'Itago ang listahan' : 'Ipakita ang listahan (' + store.topReports().length + ')' }}
    </button>
  </div>

  @if (showList) {
    <app-top-reports-panel
      (reportFocused)="focusReport($event)"
      (photoRequested)="openPhoto($event)"
    />
  }

  <button
    type="button"
    class="map-page__report-btn"
    [class.map-page__report-btn--active]="pinDropMode"
    (click)="togglePinDropMode()"
  >
    {{ pinDropMode ? 'Kanselahin' : 'Mag-ulat dito' }}
  </button>

  @if (pinDropMode && !pendingPin) {
    <div class="map-page__hint">I-click ang mapa sa lugar na may baha.</div>
  }

  @if (pendingPin) {
    <app-report-form
      [pin]="pendingPin"
      (submitted)="closeReportForm()"
      (cancelled)="closeReportForm()"
    />
  }

  @if (viewingPhotoUrl) {
    <app-modal (closed)="closePhoto()">
      <img class="map-page__photo" [src]="viewingPhotoUrl" alt="Larawan ng ulat bilang patunay" />
    </app-modal>
  }
</div>
