<header class="topbar">
  <div class="topbar__left">
    <mb-brand />
    <span class="topbar__tag">Admin</span>
  </div>

  <div class="topbar__right">
    <a class="topbar__link topbar__link--external" [href]="publicSiteUrl + '/map'">Live map</a>

    @if (auth.user(); as user) {
      <a routerLink="/account" routerLinkActive="topbar__link--active" class="topbar__who" [title]="user.email"
        >{{ user.displayName || user.email }} · {{ user.roles.join(', ') }}</a
      >
    }

    <mb-theme-toggle />
    <button type="button" class="topbar__signout" (click)="signOut()">Sign out</button>
  </div>

  @if (!auth.mustChangePassword()) {
    <nav class="topbar__nav" aria-label="Admin navigation">
      @for (item of navItems(); track item.path) {
        <a [routerLink]="item.path" routerLinkActive="topbar__link--active" class="topbar__link">{{ item.label }}</a>
      }
    </nav>
  }
</header>

<main class="content">
  <router-outlet />
</main>
