<div class="analytics-page" role="main">
  <div class="analytics-page__panel">
    <h2>Flood-prone areas</h2>
    <p class="analytics-page__subtitle">
      Historical reports, including expired/resolved ones — heavier color means more/worse flooding reported over time.
    </p>

    <div class="analytics-page__field">
      <span class="analytics-page__label" id="range-label">Saklaw ng panahon</span>
      <div class="analytics-page__range-buttons" role="group" aria-labelledby="range-label">
        <button type="button" [class.active]="range() === '1m'" (click)="setRange('1m')">1 buwan</button>
        <button type="button" [class.active]="range() === '3m'" (click)="setRange('3m')">3 buwan</button>
        <button type="button" [class.active]="range() === '6m'" (click)="setRange('6m')">6 buwan</button>
        <button type="button" [class.active]="range() === '1y'" (click)="setRange('1y')">1 taon</button>
        <button type="button" [class.active]="range() === 'all'" (click)="setRange('all')">Lahat</button>
      </div>
    </div>

    <div class="analytics-page__field">
      <label for="region-select">Rehiyon</label>
      <select id="region-select" (change)="onRegionChange($event)">
        <option value="">Lahat ng rehiyon</option>
        @for (r of availableRegions(); track r) {
          <option [value]="r" [selected]="r === selectedRegion()">{{ r }}</option>
        }
      </select>
    </div>

    @if (selectedRegion()) {
      <div class="analytics-page__field">
        <label for="province-select">Probinsya</label>
        <select id="province-select" (change)="onProvinceChange($event)">
          <option value="">Lahat ng probinsya</option>
          @for (p of availableProvinces(); track p) {
            <option [value]="p" [selected]="p === selectedProvince()">{{ p }}</option>
          }
        </select>
      </div>
    }

    @if (selectedProvince()) {
      <div class="analytics-page__field">
        <label for="city-select">Lungsod/Bayan</label>
        <select id="city-select" (change)="onCityChange($event)">
          <option value="">Lahat ng lungsod/bayan</option>
          @for (c of availableCities(); track c) {
            <option [value]="c" [selected]="c === selectedCity()">{{ c }}</option>
          }
        </select>
      </div>
    }

    @if (isLoading()) {
      <p class="analytics-page__count">Naglo-load...</p>
    } @else {
      <p class="analytics-page__count">{{ points().length }} historical reports</p>
    }
  </div>

  <div class="analytics-page__map" #mapContainer></div>
</div>
