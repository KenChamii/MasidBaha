<div class="analytics-page" role="main">
  <div class="analytics-page__panel">
    <h2>{{ 'analytics.title' | t }}</h2>
    <p class="analytics-page__subtitle">
      {{ 'analytics.sub' | t }}
    </p>

    <div class="analytics-page__field">
      <span class="analytics-page__label" id="range-label">{{ 'analytics.range' | t }}</span>
      <div class="analytics-page__range-buttons" role="group" aria-labelledby="range-label">
        <button type="button" [class.active]="range() === '1m'" (click)="setRange('1m')">
          {{ 'analytics.range.1m' | t }}
        </button>
        <button type="button" [class.active]="range() === '3m'" (click)="setRange('3m')">
          {{ 'analytics.range.3m' | t }}
        </button>
        <button type="button" [class.active]="range() === '6m'" (click)="setRange('6m')">
          {{ 'analytics.range.6m' | t }}
        </button>
        <button type="button" [class.active]="range() === '1y'" (click)="setRange('1y')">
          {{ 'analytics.range.1y' | t }}
        </button>
        <button type="button" [class.active]="range() === 'all'" (click)="setRange('all')">
          {{ 'analytics.range.all' | t }}
        </button>
      </div>
    </div>

    <div class="analytics-page__field">
      <label for="region-select">{{ 'analytics.region' | t }}</label>
      <select id="region-select" (change)="onRegionChange($event)">
        <option value="">{{ 'analytics.allRegions' | t }}</option>
        @for (r of availableRegions(); track r) {
          <option [value]="r" [selected]="r === selectedRegion()">{{ r }}</option>
        }
      </select>
    </div>

    @if (selectedRegion()) {
      <div class="analytics-page__field">
        <label for="province-select">{{ 'analytics.province' | t }}</label>
        <select id="province-select" (change)="onProvinceChange($event)">
          <option value="">{{ 'analytics.allProvinces' | t }}</option>
          @for (p of availableProvinces(); track p) {
            <option [value]="p" [selected]="p === selectedProvince()">{{ p }}</option>
          }
        </select>
      </div>
    }

    @if (selectedProvince()) {
      <div class="analytics-page__field">
        <label for="city-select">{{ 'analytics.city' | t }}</label>
        <select id="city-select" (change)="onCityChange($event)">
          <option value="">{{ 'analytics.allCities' | t }}</option>
          @for (c of availableCities(); track c) {
            <option [value]="c" [selected]="c === selectedCity()">{{ c }}</option>
          }
        </select>
      </div>
    }

    @if (isLoading()) {
      <p class="analytics-page__count" aria-busy="true">
        <span class="sr-only">{{ 'analytics.loading' | t }}</span>
        <span class="skeleton analytics-page__skeleton" aria-hidden="true"></span>
      </p>
    } @else {
      <p class="analytics-page__count">{{ 'analytics.count' | t: { n: points().length } }}</p>
    }
  </div>

  <div class="analytics-page__map" #mapContainer></div>
</div>
