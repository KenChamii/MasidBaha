<div class="map-page" [class.map-page--banner]="isOffline() || isShowingCachedData()" role="main">
  <app-offline-banner
    [isOffline]="isOffline()"
    [isShowingCachedData]="isShowingCachedData()"
    [cachedDataSavedAt]="cachedDataSavedAt()"
  />

  <div #mapContainer class="map-page__map"></div>

  <div class="map-page__toolbar">
    <mb-theme-toggle />
    <app-push-toggle />
    <app-watch-areas [center]="mapCenter()" />
    <app-weather-layers (zoomToStorm)="zoomToStorm($event)" />
    <button type="button" class="map-page__list-toggle" (click)="toggleList()">
      @if (showList()) {
        <span class="map-page__long">Itago ang listahan</span>
        <span class="map-page__short">Itago</span>
      } @else {
        <span class="map-page__long">Ipakita ang listahan ({{ store.topReports().length }})</span>
        <span class="map-page__short">Listahan ({{ store.topReports().length }})</span>
      }
    </button>
  </div>

  @if (showList()) {
    <app-top-reports-panel (reportFocused)="focusReport($event)" (photoRequested)="openPhoto($event)" />
  }

  <button
    type="button"
    class="map-page__report-btn"
    [class.map-page__report-btn--active]="pinDropMode()"
    (click)="togglePinDropMode()"
  >
    {{ pinDropMode() ? 'Kanselahin' : 'Mag-ulat dito' }}
  </button>

  @if (pinDropMode() && !pendingPin()) {
    <div class="map-page__hint">I-click ang mapa sa lugar na may baha.</div>
  }

  @if (pendingPin(); as pin) {
    <app-report-form [pin]="pin" (submitted)="closeReportForm()" (cancelled)="closeReportForm()" />
  }

  @if (viewingPhotoUrl(); as photoUrl) {
    <mb-modal (closed)="closePhoto()">
      <img class="map-page__photo" [src]="photoUrl" alt="Larawan ng ulat bilang patunay" />
    </mb-modal>
  }
</div>
