<header class="nav">
  <div class="nav__inner">
    <mb-brand />

    <nav class="nav__links" [attr.aria-label]="'nav.aria' | t">
      <a routerLink="/" fragment="how">{{ 'nav.how' | t }}</a>
      <a routerLink="/" fragment="features">{{ 'nav.features' | t }}</a>
      <a routerLink="/" fragment="stack">{{ 'nav.stack' | t }}</a>
    </nav>

    <div class="nav__actions">
      <mb-lang-toggle />
      <mb-theme-toggle />
      <a class="btn btn--primary btn--sm" routerLink="/map"
        ><span class="nav__long">{{ 'nav.openMap' | t }}</span
        ><span class="nav__short">{{ 'nav.openMapShort' | t }}</span></a
      >
    </div>
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer class="footer">
  <span>{{ i18n.t('footer.text', { year: currentYear }) }}</span>
</footer>
