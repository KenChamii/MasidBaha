<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MasidBaha: real-time flood map of the Philippines</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="icons/logo.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="48x48" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0B1F33" />
    <meta
      name="description"
      content="Know before you go. Community flood reports, confirmed by neighbours, on a live map of the Philippines."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MasidBaha" />
    <meta property="og:title" content="MasidBaha: real-time flood map of the Philippines" />
    <meta
      property="og:description"
      content="Know before you go. Community flood reports, confirmed by neighbours, on a live map."
    />
    <!-- The deploy workflow turns these into absolute addresses (social sites need that) -->
    <meta property="og:image" content="/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-default.png" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <script>
      // Apply the saved/OS theme before first paint to avoid a light flash in dark mode
      try {
        var t =
          localStorage.getItem('masidbaha-theme') ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
